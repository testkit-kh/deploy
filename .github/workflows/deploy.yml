name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [image-published]

env:
  DEPLOY_PATH: /opt/chistyi-bereg

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,Caddyfile,postgres/init/*"
          target: ${{ env.DEPLOY_PATH }}

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d
            # up -d only recreates containers when the compose service definition
            # changes; a Caddyfile content-only edit needs an explicit restart to
            # actually take effect (bind mounts aren't hashed).
            docker compose restart proxy
            docker image prune -f
